<div class="site-shell" [class.site-shell--dimmed]="phoneModalVisible()">
  <div class="scanline"></div>
  <app-custom-cursor></app-custom-cursor>
  <app-human (click)="honkService.honk()" data-cursor="pointer"></app-human>
  <app-navbar></app-navbar>
  <style class="dynamic-style"></style>
  <main>
    <app-transition-shell [flip]="flip" [disabled]="disabled">
      <router-outlet></router-outlet>
    </app-transition-shell>
  </main>
</div>

<app-contact-phone-modal
  (visibleChange)="onPhoneModalVisibleChange($event)"
></app-contact-phone-modal>
