@if (hoverTextValue()) {
  <p
    #mouseElement
    class="pointer-events-none color-white fixed z-50 [font-family:JetBrains_Mono] text-xs bg-black"
    [style.left]="animatedX() + 'px'"
    [style.top]="animatedY() + 'px'"
    [@fadeInScale]
  >
    @if (!showMarquee()) {
      {{ '[' + hoverTextValue() + ']' }}
    } @else {
      <span class="flex gap-0.5">
        <span>[Now Playing]</span>
        <app-marquee [text]="hoverTextValue()!" />
      </span>
    }
  </p>
}
