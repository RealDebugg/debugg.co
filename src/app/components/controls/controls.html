<div class="container">
  <div>
    <input type="checkbox" id="mutemusic" [checked]="mutedMusic" (change)="musicService.toggleMute($any($event.target).checked)">&nbsp;
    <label for="mutemusic">Mute music</label>
  </div>
  <div>
    <input type="checkbox" id="muterain" [checked]="mutedRain" (change)="weatherService.toggleMute($any($event.target).checked)">&nbsp;
    <label for="muterain">Mute rain</label>
  </div>
</div>
